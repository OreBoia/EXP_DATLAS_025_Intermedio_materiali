spring.application.name=shopflow

# PostgreSQL di sviluppo (compose.yaml). Con spring-boot-docker-compose il container parte da solo
spring.datasource.url=jdbc:postgresql://localhost:5432/shopflow
spring.datasource.username=shopflow
spring.datasource.password=shopflow

# MG5: in sviluppo le tabelle (anche event_publication di Modulith) le crea Hibernate.
# In produzione si usa uno script di migrazione (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# traduce le eccezioni di persistenza in DataAccessException (è il default, esplicitato dal team)
spring.dao.exceptiontranslation.enabled=true

# MG5: registro eventi di Spring Modulith
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=archive

# MG2: client dichiarativo verso il magazzino remoto (servizio di MG6): indirizzo e timeout letti da MagazzinoProperties
shopflow.magazzino.base-url=http://localhost:8081
shopflow.magazzino.read-timeout=2s

# Gestore pagamenti simulato: oltre questa soglia il pagamento è rifiutato (prova del rollback, MG5)
shopflow.pagamenti.soglia-massima=1000.00

# MG5: decommentare per vedere apertura, partecipazione, commit e rollback delle transazioni
#logging.level.org.springframework.transaction=TRACE
